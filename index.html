<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101624">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>Retail Intelligence Monitor</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#eef4ff;background:#0e1422}*{box-sizing:border-box}body{margin:0}main{max-width:1050px;margin:auto;padding:30px 20px 70px}small,.muted{color:#a7b8d1}.eyebrow{letter-spacing:.16em;text-transform:uppercase;color:#65e0c2;font-size:12px;font-weight:700}h1{font-size:clamp(30px,6vw,52px);letter-spacing:-.04em;margin:12px 0}h2{font-size:23px;margin:0 0 12px}p{line-height:1.65}header p{color:#b7c8e1}.tabs{display:flex;gap:9px;overflow-x:auto;padding:18px 0 22px}.tabs button{border:1px solid #35445e;background:#1a2639;color:#e6efff;border-radius:30px;padding:12px 16px;white-space:nowrap;cursor:pointer;font-weight:600}.tabs button.active{background:#65e0c2;color:#09221c;border-color:#65e0c2}.intro,.card{border:1px solid #33415c;background:#1a2538;border-radius:17px;padding:20px;margin-bottom:14px}.intro{background:#162b35;border-color:#315b60}.meta{display:flex;gap:10px;justify-content:space-between;align-items:center;color:#a7b8d1;font-size:13px;flex-wrap:wrap}.score{color:#6ce7c9;background:#24433f;padding:7px 10px;border-radius:9px;font-weight:800}.card h3{font-size:19px;margin:13px 0}.card a{color:#69e4c6;font-weight:700;text-decoration:none}.card a:hover{text-decoration:underline}.source{font-size:13px;color:#a7b8d1}.info{margin-top:20px;color:#a7b8d1;font-size:12px}.topline{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.psych .article-text{font-size:16px;line-height:1.85}.psych .market-example{margin-top:20px;padding:16px;border-left:3px solid #65e0c2;background:#162b35;border-radius:8px}.psych .market-example p{margin-bottom:0}.psych a{color:#6ce7c9}.error{color:#ffc9b9}@media(min-width:800px){.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{margin:0}}
</style>
</head>
<body><main><header><div class="eyebrow">DEIN PERSÖNLICHER NACHRICHTENMONITOR</div><h1>Retail Intelligence<span style="color:#65e0c2">.</span></h1><p>Vier Perspektiven auf Handel, Konsum, Technologie und Verhaltenspsychologie.</p><div class="topline"><small id="updated">Recherche wird geladen …</small><small>Nachrichten: rollierende 7 Tage · Top 10 je Bereich</small></div></header>
<nav class="tabs" aria-label="Themenbereiche"><button data-tab="handel" class="active">Handels-News</button><button data-tab="konsum">Konsumtrends</button><button data-tab="tech">Technologie & KI</button><button data-tab="psych">Verhaltenspsychologie</button></nav>
<section id="content" aria-live="polite">Daten werden geladen …</section><div class="info" id="method"></div></main>
<script>
let dataset=null,tab='handel';const content=document.getElementById('content');
function escapeHtml(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function url(x){try{let u=new URL(x);return ['https:','http:'].includes(u.protocol)?u.href:'#'}catch{return '#'}}
function render(){if(!dataset)return;
 if(tab==='psych'){
  let p=dataset.psychology;
  content.innerHTML=`<div class="intro"><small>WISSENSCHAFTLICHER IMPULS · AKTUELLER DURCHLAUF</small><h2>${escapeHtml(p.title)}</h2><p><strong>Theoretischer Bezug:</strong> ${(p.theories||[]).map(escapeHtml).join(' · ')}</p></div><div class="card psych"><p class="article-text">${(p.sentences||[]).map(escapeHtml).join(' ')}</p>${p.example?.length?`<div class="market-example"><strong>Beispiel aus dem Konsumalltag</strong><p>${p.example.map(escapeHtml).join(' ')}</p></div>`:''}<h3>Wissenschaftliche Literatur</h3>${(p.reference||[]).map(r=>`<p><a href="${url(r.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(r.label)} ↗</a></p>`).join('')}<p class="source">KI-generierter Fachtext auf Basis vorgegebener Literatur. Aussagen vor wissenschaftlicher Verwendung überprüfen.</p></div>`;
  return;
 }
 let group=dataset.categories[tab];
 content.innerHTML=`<div class="intro"><small>DIE WICHTIGSTEN ENTWICKLUNGEN</small><p>${escapeHtml(group.lead)}</p></div><h2>Top ${group.items.length} Entwicklungen</h2><div class="cards">${group.items.map((x,i)=>`<article class="card"><div class="meta"><span>Rang ${i+1} · ${escapeHtml(x.date)}</span><span class="score">${x.score}/100</span></div><h3>${escapeHtml(x.title)}</h3><p>${escapeHtml(x.summary)}</p><p class="source">${escapeHtml(x.source)} · ${x.source_count} Quelle(n) · ${x.article_count} erfasste Artikel</p><a href="${url(x.url)}" target="_blank" rel="noopener noreferrer">Zentralen Artikel lesen ↗</a>${x.sources.length>1?`<p class="source">Weitere Berichterstattung: ${escapeHtml(x.sources.filter(s=>s!==x.source).join(', '))}</p>`:''}</article>`).join('')}</div>`;
}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()}));
fetch('data.json?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Keine Datendatei gefunden');return r.json()}).then(d=>{dataset=d;document.getElementById('updated').textContent='Letzte Recherche: '+new Date(d.updated_at).toLocaleString('de-DE',{dateStyle:'medium',timeStyle:'short',timeZone:'Europe/Berlin'});document.getElementById('method').textContent=d.methodology;render()}).catch(e=>content.innerHTML=`<p class="error">Die Rechercheergebnisse sind noch nicht verfügbar. Bitte den GitHub-Workflow einmal ausführen. (${escapeHtml(e.message)})</p>`);
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
