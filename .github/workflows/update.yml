
name: Daily Intelligence Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python installieren
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhaengigkeiten installieren
        run: pip install feedparser requests

      - name: Nachrichten aktualisieren
        run: python collect.py

      - name: Aenderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --soft origin/main
          git add site/
          if ! git diff --cached --quiet; then
            git commit -m "Update Intelligence Monitor"
            git push origin HEAD:main
          fi

      - name: Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Website hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Website veroeffentlichen
        uses: actions/deploy-pages@v4
