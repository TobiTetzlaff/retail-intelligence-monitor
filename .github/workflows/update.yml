
name: Daily Intelligence Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: retail-intelligence-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python installieren
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhaengigkeiten installieren
        run: pip install feedparser requests openai

      - name: Nachrichten aktualisieren
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python collect.py

      - name: Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Website hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Website veroeffentlichen
        id: deployment
        uses: actions/deploy-pages@v4

